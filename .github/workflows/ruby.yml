name: Manyo self evaluation

on:
  push:
    branches:
      - step1
      - step2
      - step3
      - step4
      - step5
  workflow_dispatch:
    inputs:
      step:
        description: 評価するステップ
        required: true
        type: choice
        options:
          - step1
          - step2
          - step3
          - step4
          - step5
  workflow_call:
    inputs:
      step:
        description: 評価するステップ
        required: true
        type: string
      evaluator_ref:
        description: 固定して使用する評価コードのタグまたはSHA
        required: false
        default: 35d72d323934e15868280a264c3de4318525adca
        type: string

permissions:
  contents: read

concurrency:
  group: manyo-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/manyo_test
      MANYO_EVALUATOR_REF: ${{ inputs.evaluator_ref || '35d72d323934e15868280a264c3de4318525adca' }}
      PGTZ: UTC
      RAILS_ENV: test
      SECRET_KEY_BASE: manyo-evaluation-test
      TZ: UTC

    steps:
      - name: Check out learner application
        uses: actions/checkout@v7

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Compile test webpack assets
        run: bundle exec rails webpacker:compile

      - name: Run learner tests and requirement evaluation
        run: bin/check "${{ inputs.step || github.ref_name }}"